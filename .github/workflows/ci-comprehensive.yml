name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-comprehensive-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PY_COLORS: "1"

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Black 24.10+ and current lint tooling require Python >= 3.9.
        # Python 3.8 is EOL and cannot install black==24.10.0.
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt

      - name: Install lint and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 "black==24.10.0" "isort[colors]>=5.10.0,<6.0.0" "mypy>=1.0.0,<2.0.0" "bandit>=1.7.0,<2.0.0" numpy Flask pytest pytest-cov

      - name: Run Black code formatter
        run: black --check --diff .

      - name: Import sorting check with isort
        run: |
          echo "::group::Import Sorting Check"
          isort --check-only --diff --profile black .
          echo "::endgroup::"

      - name: Lint with flake8
        run: |
          echo "::group::Flake8 Linting"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
          echo "::endgroup::"

      - name: Type checking with mypy
        run: |
          echo "::group::Type Checking"
          mypy . --ignore-missing-imports --python-version=${{ matrix.python-version }} || echo "Type checking completed with warnings"
          echo "::endgroup::"

      - name: Security linting with bandit
        continue-on-error: true
        run: |
          echo "::group::Security Linting"
          bandit -r . -x "*/test*,*/venv/*,*/.venv/*" -q || echo "Security linting completed with findings"
          echo "::endgroup::"

  test:
    name: Testing (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest-xdist coverage

      - name: Create test directories
        shell: bash
        run: mkdir -p tests data/known_faces data/unknown_faces logs

      - name: Set PYTHONPATH
        shell: bash
        run: echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Run basic import tests
        shell: bash
        run: |
          echo "::group::Import Tests"
          python -c "
          import sys
          failures = []
          try:
              import src.config
              print('OK config')
          except Exception as e:
              print(f'FAIL config: {e}')
              failures.append('config')
          try:
              import cv2
              print('OK cv2')
          except Exception as e:
              print(f'FAIL cv2: {e}')
              failures.append('cv2')
          try:
              import numpy
              print('OK numpy')
          except Exception as e:
              print(f'FAIL numpy: {e}')
              failures.append('numpy')
          if failures:
              sys.exit(1)
          "
          echo "::endgroup::"

      - name: Run pytest
        shell: bash
        run: |
          echo "::group::Pytest Execution"
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
          else
            echo "No tests directory or test files found, skipping pytest"
          fi
          echo "::endgroup::"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [code-quality, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools numpy Flask

      - name: Validate project structure
        run: |
          echo "::group::Project Structure Validation"
          find . -type f -name "*.py" | head -20
          pip check || echo "Some dependency conflicts exist but build can continue"
          echo "::endgroup::"

      - name: Create source distribution
        run: |
          mkdir -p dist
          tar -czf dist/face-recon-source.tar.gz \
            --exclude='__pycache__' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='*.pyc' \
            src/ backend/ tests/ requirements.txt requirements-ci.txt README.md pyproject.toml
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: face-recon-build
          path: dist/
          retention-days: 30

  security:
    name: Security & Compliance
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7.0,<2.0.0" pip-audit
          pip install numpy Flask || echo "Optional dependencies not available for security scan"

      - name: Run pip-audit
        continue-on-error: true
        run: |
          echo "::group::pip-audit"
          pip-audit -r requirements.txt || true
          echo "::endgroup::"

      - name: Run bandit security linter
        continue-on-error: true
        run: |
          echo "::group::Code Security Analysis"
          bandit -r . -f json -o bandit-report.json -x "*/test*,*/venv/*,*/.venv/*" || true
          if [ -f bandit-report.json ]; then
            python -m json.tool bandit-report.json | head -100
          fi
          echo "::endgroup::"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: face-recon-build
          path: dist/

      - name: Validate deployment artifacts
        run: |
          if [ ! -f "dist/face-recon-source.tar.gz" ]; then
            echo "Source distribution not found!"
            exit 1
          fi
          ls -la dist/
          tar -tzf dist/face-recon-source.tar.gz | head -10
          echo "Deployment simulation completed"

  notify:
    name: Notification & Reporting
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, security, deploy]
    if: always()

    steps:
      - name: Generate workflow summary
        run: |
          echo "## CI/CD Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Testing | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if required jobs failed
        if: needs.code-quality.result != 'success' || needs.test.result != 'success' || needs.build.result != 'success' || needs.security.result != 'success'
        run: |
          echo "Required CI jobs did not all succeed."
          exit 1
